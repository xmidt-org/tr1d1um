---
## SPDX-FileCopyrightText: 2022 Comcast Cable Communications Management, LLC
## SPDX-License-Identifier: Apache-2.0
########################################
#   Labeling/Tracing via HTTP Headers Configuration
########################################

# The unique fully-qualified-domain-name of the server.  It is provided to
# the X-Tr1d1um-Server header for showing what server fulfilled the request
# sent.
# (Optional)
server: "tr1d1um-local-instance-123.example.com"

# Provides this build number to the X-Tr1d1um-Build header for
# showing machine version information.  The build number SHOULD
# match the scheme `version-build` but there is not a strict requirement.
# (Optional)
build: "0.1.3-434"

# Provides the region information to the X-Tr1d1um-Region header
# for showing what region this machine is located in.  The region
# is arbitrary and optional.
# (Optional)
region: "east"

# Provides the flavor information to the X-Tr1d1um-Flavor header
# for showing what flavor this machine is associated with.  The flavor
# is arbitrary and optional.
# (Optional)
flavor: "mint"

prometheus:
  defaultNamespace: webpa
  defaultSubsystem: tr1d1um
  constLabels:
    development: "true"
  handler:
    maxRequestsInFlight: 5
    timeout: 5s
    instrumentMetricHandler: true

health:
  disableLogging: false
  custom:
    server: development

########################################
#   Primary Endpoint Configuration
########################################

servers:
  primary:
    address: :6100
    header:
      X-Midt-Server:
        - tr1d1um
      X-Midt-Version:
        - development
  alternate:
    address: :8090
    header:
      X-Midt-Server:
        - tr1d1um
      X-Midt-Version:
        - development
  metrics:
    address: :6101
    header:
      X-Midt-Server:
        - tr1d1um
      X-Midt-Version:
        - development
  health:
    address: :6102
    header:
      X-Midt-Server:
        - tr1d1um
      X-Midt-Version:
        - development
  pprof:
    address: :6103

########################################
#   Logging Related Configuration
########################################

logging:
  # OutputPaths is a list of URLs or file paths to write logging output to.
  outputPaths:
    - stdout
    # - /var/log/tr1d1um/tr1d1um.log

  # Level is the minimum enabled logging level. Note that this is a dynamic
  # level, so calling Config.Level.SetLevel will atomically change the log
  # level of all loggers descended from this config.
  level: debug

  # EncoderConfig sets options for the chosen encoder. See
  # zapcore.EncoderConfig for details.
  errorOutputPaths:
    - stderr

  # EncoderConfig sets options for the chosen encoder. See
  # zapcore.EncoderConfig for details.
  encoderConfig:
    messageKey: message
    levelKey: key
    levelEncoder: lowercase
  # reducedLoggingResponseCodes allows disabling verbose transaction logs for
  # benign responses from the target server given HTTP status codes.  499 is
  # recorded when the caller closed its connection before the request
  # finished; no caller ever receives it.
  # (Optional)
  # reducedLoggingResponseCodes: [200, 499, 504]

  # Encoding sets the logger's encoding. Valid values are "json" and
  # "console", as well as any third-party encodings registered via
  # RegisterEncoder.
  encoding: json

##############################################################################
# Credential Fingerprinting
##############################################################################
# fingerprintCreds controls how inbound Bearer credentials are fingerprinted
# into per-request log fields for tracing/correlation. Defaults are off; set
# one or both sub-keys to emit the corresponding field on every request log.
#   - lastNdigits: when > 0, log the last N characters of the token as
#     "credSuffix". Tokens shorter than N are not logged.
#   - sha256: when true, log the hex-encoded sha256 of the token as "credSHA".
# (Optional)
# fingerprintCreds:
#   sha256: false
#   lastNdigits: 0

##############################################################################
# Parameter Logging
##############################################################################
# parameterLogging controls which TR-181 parameter values are included in log
# output.  Parameter names are always logged; this controls only values.
# Separate rules can be configured for GET and PATCH operations.
#
# Each section supports two modes:
#   - "never"  (default) -- log no values, except parameters matching the
#     patterns in the except list (allowlist).
#   - "always" -- log all values, except parameters matching the patterns
#     in the except list (denylist).
#
# Pattern syntax (case-insensitive):
#   - *  matches any characters except '.' (single level)
#   - ** matches any characters including '.' (multi-level)
#
# Default: both GET and PATCH are "never" with no exceptions (log no values).
# (Optional)
# parameterLogging:
#   get:
#     mode: never
#     except:
#       - "Device.WiFi.**"
#       - "Device.DeviceInfo.SerialNumber"
#   patch:
#     mode: always
#     except:
#       - "Device.Security.**"

##############################################################################
# Webhooks Related Configuration
##############################################################################
# webhook provides configuration for storing and obtaining webhook
# information using Argus.
# Optional: if key is not supplied, webhooks would be disabled.
webhook:

  # disablePartnerIDs, if true, will allow webhooks to register without
  # checking the validity of the partnerIDs in the request
  # Defaults to 'false'.
  disablePartnerIDs: false

  # validation provides options for validating the webhook's URL and TTL
  # related fields. Some validation happens regardless of the configuration:
  # URLs must be a valid URL structure, the Matcher.DeviceID values must
  # compile into regular expressions, and the Events field must have at
  # least one value and all values must compile into regular expressions.
  validation:

    # url provides options for additional validation of the webhook's
    # Config.URL, FailureURL, and Config.AlternativeURLs fields.
    url:
      # httpsOnly will allow only URLs with https schemes through if true.
      # (Optional). Defaults to 'false'.
      httpsOnly: false

      # allowLoopback will allow any canonical or IP loopback address if
      # true. Otherwise, loopback addresses are considered invalid.
      # (Optional). Defaults to 'false'.
      allowLoopback: true

      # allowIP allows the different webhook URLs to have IP hostnames if set to true.
      # (Optional). Defaults to 'false'.
      allowIP: true

      # allowSpecialUseHosts allows URLs that include reserved domains if set to true.
      # Read more here: https://en.wikipedia.org/wiki/Top-level_domain#Reserved_domains
      # (Optional). Defaults to 'false'.
      allowSpecialUseHosts: true

      # allowSpecialUseIPs, if set to true, allows URLs that contain or route to IPs that have
      # been marked as reserved through various RFCs: rfc6761, rfc6890, rfc8190.
      # (Optional). Defaults to 'false'.
      allowSpecialUseIPs: true

      # invalidHosts is a slice that contains strings that we do not want
      # allowed in URLs, providing a way to deny certain domains or hostnames.
      # (Optional). Defaults to an empty slice.
      invalidHosts: []

      # invalidSubnets is a list of IP subnets.  If a URL contains an
      # IP or resolves to an IP in one of these subnets, the webhook is
      # considered invalid.
      # (Optional). Defaults to an empty slice.
      invalidSubnets: []

    # ttl provides information for what is considered valid for time-related
    # fields (Duration and Until) in the webhook.  A webhook set to expire
    # too far in the future is considered invalid, while a time in the past
    # is considered equivalent to a request to delete the webhook.
    # Regardless of this configuration, either Until or Duration must have a
    # non-zero value.
    ttl:
      # max is the length of time a webhook is allowed to live.  The Duration
      # cannot be larger than this value, and the Until value cannot be set
      # later than the current time + max + jitter.
      max: 1m

      # jitter is the buffer time added when checking that the Until value is
      # valid.  If there is a slight clock skew between servers or some delay
      # in the http request, jitter should help account for that when ensuring
      # that Until is not a time too far in the future.
      jitter: 10s

  # client configures the Argus client.
  client:
    # storeBaseURL is Argus' network location.
    storeBaseURL: "http://localhost:6600"

    # storeAPIPath is the Argus store API path.
    # (Optional). Defaults to "/api/v1/store".
    # storeAPIPath: "/api/v1/store"

    # bucket is the partition name where webhooks will be stored.
    bucket: "webhooks"

    # clientTimeout is the timeout for requests made through this HTTP
    # client. This timeout includes connection time, any redirects, and
    # reading the response body.
    # (Optional). Defaults to 50s.
    clientTimeout: 50s

    # netDialerTimeout is the maximum amount of time the HTTP Client Dialer
    # will wait for a connect to complete.
    # (Optional). Defaults to 5s.
    netDialerTimeout: 5s

  # listener configures how the current list of webhooks is kept up to date.
  # (Optional)
  listener:
    # pullInterval provides how often the current webhooks list gets refreshed.
    # (Optional). Defaults to 5s.
    pullInterval: 5s

##############################################################################
# Authentication and Authorization
##############################################################################
# auth configures the credentials accepted on inbound requests and the
# credentials attached to the requests tr1d1um makes.
auth:
  # inbound configures how callers authenticate to tr1d1um.  Exactly one of
  # basic or jwt must be configured: the server refuses to start with both or
  # with neither.
  inbound:
    # maxValueLen is the most bytes of a caller's principal, a partner ID or a
    # parameter name that are recorded in a metric label or a log line.  These
    # come from a token or a request, so a longer value is cut and ends with
    # "...", which stops a caller from filling the logs or the metrics with
    # very long values.  Invalid UTF-8 is replaced whatever the length.
    # Optional: the default is 256.
    # maxValueLen: 256

    # maxWarningLen is the most bytes of a capability warning that are logged,
    # a warning holding several values such as a capability.  Optional: the
    # default is 1024.
    # maxWarningLen: 1024

    # basic is a list of base64-encoded "user:password" credentials.  An
    # inbound "Authorization: Basic" header is accepted only when it matches
    # one of them.
    #
    # It is intended for local testing.  A basic credential carries no
    # capabilities and no partner IDs, so a caller using one is not subject
    # to capability checks and supplies partner IDs through the
    # X-Xmidt-Partner-Id header, on device requests and webhook requests
    # alike.  A JWT's partner IDs come from its claims and the header is
    # ignored.
    #
    # WARNING! Be sure to remove this from your production config.
    basic: ["dXNlcjpwYXNz"]

    # jwt configures Bearer authentication.  A token is accepted when it is
    # signed by a key one of the clortho providers below supplies, it carries
    # a capability granting the request, and it states the partner IDs its
    # bearer may act for at the allowedResources.allowedPartners claim.
    #
    # A capability has the form {prefix}{endpoint}:{method}, for example
    # "webpa-prefix-api:device/.*/config:get".  The endpoint is a regular
    # expression matched against the request path with the /api/vN prefix
    # removed, and the method is the lowercased HTTP verb or the
    # acceptAllMethod value.
    # jwt:
    #   # prefixes are the capability prefixes this service honors.  A
    #   # capability with any other prefix is ignored.  A prefix is matched
    #   # literally.  Required.
    #   prefixes: ["webpa-prefix-api:"]
    #
    #   # acceptAllMethod is the method value that grants every HTTP method.
    #   # (Optional). Defaults to "all".
    #   acceptAllMethod: "all"
    #
    #   # cacheSize bounds how many compiled capability endpoint patterns are
    #   # retained.
    #   # (Optional). Defaults to 1024.
    #   cacheSize: 1024
    #
    #   # endpointBuckets are regular expressions that group requests by
    #   # endpoint for the auth_capability_check metric.
    #   # (Optional)
    #   endpointBuckets:
    #     - "hook\\b"
    #     - "hooks\\b"
    #     - "device/.*/stat\\b"
    #     - "device/.*/config\\b"
    #
    #   # cidr holds a token's bearer to the networks its CIDR capabilities
    #   # name, for example "webpa-prefix-cidr:96.44.169.0/24".  The caller
    #   # origin (see trustedProxies below) must be inside at least one of
    #   # them.
    #   # CIDR capabilities only limit access; a token with none is
    #   # unrestricted unless mode requires one.  A capability whose network
    #   # cannot be parsed, including a bare address without /bits, still
    #   # counts as present but matches nothing, so a typo never removes a
    #   # limit.  Every problem is logged and counted in the
    #   # auth_capability_warning metric, and, in a mode with warnings,
    #   # reported to the caller in an X-Webpa-Capability-Warning header,
    #   # whether or not the request was blocked.
    #   # (Optional). When absent, CIDR capabilities are not checked.
    #   cidr:
    #     # prefixes select a token's CIDR capabilities.  A capability with
    #     # any other prefix is ignored.  A prefix is matched literally.
    #     # Required.
    #     prefixes: ["webpa-prefix-cidr:"]
    #
    #     # mode decides what a failure does, whether the caller is told,
    #     # and what a token with no CIDR capability means.  Every mode logs
    #     # and counts what it finds.
    #     #   permissive              nothing is rejected and the caller is
    #     #                           told nothing; a token with no CIDR
    #     #                           capability is unrestricted.
    #     #   permissiveWithWarnings  permissive, and the caller is told in
    #     #                           the warning header what enforce would
    #     #                           have rejected and which capabilities
    #     #                           are malformed.
    #     #   enforce                 a failure is a 403, and the caller is
    #     #                           told about malformed capabilities.
    #     #   required                enforce, and a token with no CIDR
    #     #                           capability is also a 403.
    #     #   permissiveRequired      permissive for required.
    #     #   permissiveRequiredWithWarnings
    #     #                           permissiveWithWarnings for required.
    #     # A newly configured check starts as a trial run; switch to
    #     # enforce or required once the log and metric are quiet.
    #     # (Optional). Defaults to "permissive".
    #     mode: "permissive"
    #
    #     # cacheSize bounds how many parsed CIDR capabilities are retained.
    #     # (Optional). Defaults to 1024.
    #     cacheSize: 1024
    #
    #     # trustedProxies are the networks of the hops this deployment
    #     # operates, such as load balancers, and trusts to report the
    #     # address they received a request from.  The caller origin of a
    #     # request is the nearest hop that is not one of them: when the peer
    #     # is a trusted proxy, the Forwarded header (RFC 7239), or
    #     # X-Forwarded-For when there is no Forwarded for=, is walked from
    #     # the right past every trusted proxy.  When the peer is not a
    #     # trusted proxy, the forwarding headers are ignored, since anyone
    #     # can set them.  Every entry must be a network: a single host is
    #     # written /32 or /128.
    #     #
    #     # Trusted proxies are deployment configuration; a token never
    #     # names them.
    #     # (Optional). Defaults to none, so the caller origin is always the
    #     # peer.
    #     trustedProxies:
    #       - "10.0.0.0/8"
    #
    #     # overrides set the networks for particular callers here, by the
    #     # token's principal (sub).  An override replaces whatever CIDR
    #     # capabilities the caller's tokens carry, wider or narrower.  An
    #     # empty list leaves the caller with no network, so they are
    #     # unrestricted, or refused in a required mode.  Every entry must
    #     # be a network: a single host is written /32 or /128.
    #     # (Optional)
    #     #
    #     # NOTE: the keys are NOT case sensitive.  The configuration
    #     # loader lowercases every map key, so "PartnerX" and "partnerx"
    #     # are the same caller, and a principal is matched to its override
    #     # without regard to case.
    #     overrides:
    #       "partner-x": ["203.0.113.0/24", "2001:db8::/32"]
    #       "exempt-caller": []
    #
    #   # rate holds a token's bearer to the rates its rate capabilities
    #   # name, for example "webpa-prefix-rate:50/1m": at most <count> calls per
    #   # <window> against this instance.  The window is a Go duration such
    #   # as 1m, 1h30m or 24h; days are not a unit.  Windows outside
    #   # minWindow and maxWindow are held at that bound at the same calls
    #   # per second, so by default 100/1s is held as 6000/1m.  A caller is held
    #   # to every rate on every token they have presented recently, so a
    #   # cut takes effect the first time the new token is used, while a
    #   # raise waits until the old rate has not been seen for twice its
    #   # window.  Limits are per instance: with N instances behind a load
    #   # balancer the caller gets roughly N times the rate overall.
    #   #
    #   # Rate capabilities only limit access; a token with none is held
    #   # to defaults, or unrestricted when there are none.  A capability
    #   # whose rate cannot be parsed still counts as present but allows
    #   # nothing, so a typo never removes a limit.  Every problem is logged
    #   # and counted in the auth_capability_warning metric, and, in a mode
    #   # with warnings, reported to the caller in an
    #   # X-Webpa-Capability-Warning header, whether or not the request was
    #   # blocked.  Over the rate, the caller gets a 429 with Retry-After.
    #   # (Optional). When absent, rate capabilities are not checked.
    #   rate:
    #     # prefixes select a token's rate capabilities, matched literally.
    #     # A capability with any other prefix is ignored.  Required.
    #     prefixes: ["webpa-prefix-rate:"]
    #
    #     # mode decides what a failure does and whether the caller is
    #     # told.  Every mode logs and counts what it finds.
    #     #   permissive              nothing is rejected and the caller is
    #     #                           told nothing.
    #     #   permissiveWithWarnings  permissive, and the caller is told in
    #     #                           the warning header what enforce would
    #     #                           have rejected and which capabilities
    #     #                           are malformed.
    #     #   enforce                 over the rate is a 429 with
    #     #                           Retry-After, and the caller is told
    #     #                           about malformed capabilities.
    #     # There is no required mode: to limit every caller, set defaults,
    #     # as slow as you like.  A newly configured check starts as a trial
    #     # run; switch to enforce once the log and metric are quiet.
    #     # (Optional). Defaults to "permissive".
    #     mode: "permissive"
    #
    #     # defaults are the rates a caller is held to when their token
    #     # carries no rate capability and they have no override.  Each
    #     # caller gets their own allowance at these rates.  Set this to
    #     # hold every caller to something before issuers add rates to
    #     # tokens.  A token whose rate is malformed is not rateless: it is
    #     # held to zero, not to the defaults.  Used as written: minWindow
    #     # and maxWindow do not apply.
    #     # (Optional). With none, such a token is unrestricted.
    #     defaults: ["600/1m", "50000/24h"]
    #
    #     # minWindow and maxWindow bound the window a token's rate is held
    #     # at.  A rate with a window outside them is rescaled to the nearer
    #     # bound at the same calls per second, rounded to the nearest call
    #     # but never below one.  A short bound lets a tiny window churn
    #     # state; a long one lets a huge window grant a huge burst.
    #     # (Optional). The defaults are shown.
    #     minWindow: 1m
    #     maxWindow: 24h
    #
    #     # overrides set the rates for particular callers here, by the
    #     # token's principal (sub).  An override replaces whatever the
    #     # caller's tokens say, looser or stricter, and takes precedence
    #     # over defaults.  An empty list makes the
    #     # caller unrestricted.  Overrides are
    #     # trusted and used as written: minWindow and maxWindow do not
    #     # apply to them.
    #     # (Optional)
    #     #
    #     # NOTE: the keys are NOT case sensitive.  The configuration
    #     # loader lowercases every map key, so "PartnerX" and "partnerx"
    #     # are the same caller, and a principal is matched to its override
    #     # without regard to case.
    #     overrides:
    #       "partner-x": ["50/1m", "10000/24h"]
    #       "exempt-caller": []
    #
    #   # param holds a token's bearer to the TR-181 parameters its
    #   # parameter capabilities name, for example
    #   # "webpa-prefix-param:Device.WiFi.**:read".  Every parameter a request
    #   # gets or sets must match a capability whose operation allows it:
    #   # ":read" covers getting values and attributes, ":write" covers
    #   # setting them and adding, replacing and deleting table rows, and
    #   # ":all" (or no suffix) covers both.  Patterns are case-insensitive:
    #   # "*" matches within one level (no "."), "**" across levels.  A
    #   # partial path such as "Device.WiFi." is allowed only by a pattern
    #   # ending in "**" that matches it; table operations act on their
    #   # table or row as a partial path.  Parameter capabilities only
    #   # narrow what the endpoint capabilities already grant; a token with
    #   # none is unrestricted.  A capability that cannot be parsed still
    #   # counts as present but matches nothing, so a typo never removes a
    #   # limit.  Every problem is logged and counted in the
    #   # auth_capability_warning metric, and, in a mode with warnings,
    #   # reported to the caller in an X-Webpa-Capability-Warning header,
    #   # whether or not the request was blocked.  A refused request is a
    #   # 403 whose X-Webpa-Capability-Warning header names the first
    #   # parameter not covered and the operation, as does the log.
    #   # (Optional). When absent, parameter capabilities are not checked.
    #   param:
    #     # prefixes select a token's parameter capabilities, matched
    #     # literally.  A capability with any other prefix is ignored.
    #     # Required.
    #     prefixes: ["webpa-prefix-param:"]
    #
    #     # mode decides what a failure does and whether the caller is
    #     # told.  Every mode logs and counts what it finds.
    #     #   permissive              nothing is rejected and the caller is
    #     #                           told nothing.
    #     #   permissiveWithWarnings  permissive, and the caller is told in
    #     #                           the warning header what enforce would
    #     #                           have rejected and which capabilities
    #     #                           are malformed.
    #     #   enforce                 a parameter no capability allows is a
    #     #                           403, and the caller is told about
    #     #                           malformed capabilities.
    #     # A newly configured check starts as a trial run; switch to
    #     # enforce once the log and metric are quiet.
    #     # (Optional). Defaults to "permissive".
    #     mode: "permissive"
    #
    #     # overrides set the parameter capabilities, without the prefix,
    #     # for particular callers here, by the token's principal (sub).
    #     # An override replaces whatever the caller's tokens say, looser
    #     # or stricter.  An empty list makes the caller unrestricted.
    #     # (Optional)
    #     #
    #     # NOTE: the keys are NOT case sensitive.  The configuration
    #     # loader lowercases every map key, so "PartnerX" and "partnerx"
    #     # are the same caller, and a principal is matched to its override
    #     # without regard to case.
    #     overrides:
    #       "partner-x": ["Device.DeviceInfo.**:read", "Device.WiFi.SSID.*.SSID"]
    #       "exempt-caller": []
    #
    #     # cacheSize bounds how many parsed parameter capabilities are
    #     # retained.
    #     # (Optional). Defaults to 1024.
    #     cacheSize: 1024
    #
    #     # maxAge limits how long a token carrying a given parameter
    #     # capability is honored, measured from the token's iat claim,
    #     # however long the issuer let the token live.  A token older than
    #     # the limit for any capability it carries is refused on every
    #     # request to every endpoint, whatever it asks for, so a risky
    #     # capability cannot outlive the deployment's tolerance for it; a
    #     # caller that does not need such a capability should not claim it.
    #     # A token with no iat cannot carry a limited capability at all.
    #     # Keys are the capability's pattern with an optional operation
    #     # suffix; a key without one applies to the pattern with any
    #     # suffix.  Overrides do not exempt
    #     # a token.  The check follows mode above; a refusal is a 403 whose
    #     # X-Webpa-Capability-Warning header names the capability, its
    #     # limit and the token's age.
    #     # (Optional)
    #     #
    #     # NOTE: the keys are NOT case sensitive.  The configuration
    #     # loader lowercases every map key, and patterns match without
    #     # regard to case anyway, so "Device.**" and "device.**" are the
    #     # same limit.
    #     maxAge:
    #       "Device.**": 30m
    #       "Device.WiFi.Security.**:write": 15m
    #
    #   # clortho configures where the keys that verify tokens come from.  At
    #   # least one provider, of any kind, is required.  Every field of the
    #   # provider configurations is accepted here; see
    #   # https://pkg.go.dev/github.com/xmidt-org/clortho for the full list.
    #   clortho:
    #     # client is the HTTP client used to reach every http or https key
    #     # source.  It never follows redirects.
    #     # (Optional). The defaults are shown.
    #     client:
    #       clientTimeout: 30s
    #       netDialerTimeout: 5s
    #
    #     # keySets poll servers that publish their keys as a JWK set, or as
    #     # a single JWK, and serve lookups from what they hold.  A token can
    #     # never cause a request to one.  Prefer this kind wherever the
    #     # server offers a key set.  A file path may also be given.
    #     keySets:
    #       - sources:
    #           - uri: "http://localhost/keys/available"
    #             # refreshInterval: 24h
    #             # minRefreshInterval: 10m
    #           # - uri: "/etc/tr1d1um/keys.json"
    #
    #     # perKeys fetch one key at a time, by the key ID a token names,
    #     # from a server such as themis that serves single keys.  Key IDs in
    #     # allowedKeyIDs are always fetched; any other is rate limited, since
    #     # it comes from a token nobody has verified yet.
    #     perKeys:
    #       - template: "http://localhost/keys/{keyID}"
    #         allowedKeyIDs: []
    #
    #     # fixed serves keys written here, as PEM or JWK text.  Nothing is
    #     # ever fetched.
    #     fixed:
    #       - keys:
    #           - keyID: "break-glass"
    #             key: |
    #               -----BEGIN PUBLIC KEY-----
    #               ...
    #               -----END PUBLIC KEY-----

  # outbound configures the credentials tr1d1um attaches to the requests it
  # makes.  fanout covers requests to the XMiDT cluster at targetURL, and
  # webhook covers requests to Argus.  For each, exactly one of basic, jwt or
  # spiffe must be configured.
  outbound:
    fanout:
      # basic is the base64-encoded "user:password" to send.
      basic: "dXNlcjpwYXNz"

      # jwt fetches a bearer token from authURL and reuses it until it nears
      # expiration.
      # jwt:
      #   # authURL is the URL to access for the token.
      #   authURL: ""
      #
      #   # payloadField is the field of the JSON response that holds the
      #   # token.
      #   payloadField: "token"
      #
      #   # requestHeaders are added to the request for the token.
      #   requestHeaders:
      #     "": ""
      #
      #   # timeout is how long the request to get the token will take before
      #   # timing out.
      #   timeout: "1m"
      #
      #   # buffer is the length of time before a token expires to get a new
      #   # token.
      #   buffer: "2m"

      # spiffe exchanges this workload's SPIFFE JWT-SVID for a bearer token,
      # so no client secret is stored.  The issuer must have the workload's
      # SPIFFE ID registered to clientID.  The token is reused until it nears
      # expiration.
      # spiffe:
      #   # tokenURL is the issuer's token endpoint.
      #   tokenURL: "https://issuer.example.com/v2/oauth/token"
      #
      #   # clientID is the issuer client the SPIFFE ID is registered to.
      #   clientID: ""
      #
      #   # scopes are the capabilities to request.  The issuer grants no
      #   # more than these, so list only what this kind of request needs,
      #   # even when the client is approved for more.  When empty, the
      #   # issuer decides.
      #   scopes:
      #     - ""
      #
      #   # (Optional) audience is the aud claim of the JWT-SVID.  Defaults
      #   # to tokenURL.
      #   audience: ""
      #
      #   # (Optional) assertionType is sent as client_assertion_type.
      #   # Defaults to urn:ietf:params:oauth:client-assertion-type:spiffe-jwt.
      #   assertionType: ""
      #
      #   # (Optional) socket is the SPIFFE Workload API address, as a
      #   # unix:// or tcp:// URI or a bare unix socket path.  Defaults to the
      #   # SPIFFE_ENDPOINT_SOCKET environment variable.  tr1d1um refuses to
      #   # start if neither is set.
      #   socket: "unix:///run/spire/sockets/agent.sock"
      #
      #   # timeout bounds fetching the SVID and exchanging it.  Defaults to
      #   # 30s.
      #   timeout: "30s"
      #
      #   # buffer is the length of time before a token expires to get a new
      #   # token.
      #   buffer: "2m"

    webhook:
      # basic is the base64-encoded "user:password" to send.
      basic: "dXNlcjpwYXNz"

      # jwt takes the same fields as auth.outbound.fanout.jwt.
      # jwt:
      #   authURL: ""
      #   payloadField: "token"
      #   requestHeaders:
      #     "": ""
      #   timeout: "1m"
      #   buffer: "2m"

      # spiffe takes the same fields as auth.outbound.fanout.spiffe.  Request
      # only the scopes webhook registration needs.
      # spiffe:
      #   tokenURL: "https://issuer.example.com/v2/oauth/token"
      #   clientID: ""
      #   scopes:
      #     - ""


##############################################################################
# WRP and XMiDT Cloud configurations
##############################################################################

# targetURL is the base URL of the XMiDT cluster
targetURL: http://scytale:6300/api/v3

# WRPSource is used as 'source' field for all outgoing WRP Messages
WRPSource: "dns:tr1d1um.example.com"

# supportedServices is a list of endpoints we support for the WRP producing endpoints
# we will soon drop this configuration
supportedServices:
  - "config"


##############################################################################
# HTTP Transaction Configurations
##############################################################################
# timeouts that apply to the XMiDT HTTP client.
# (Optional) By default, the values below will be used.
xmidtClientTimeout:
  # clientTimeout is the timeout for the requests made through this
  # HTTP client. This timeout includes connection time, any
  # redirects, and reading the response body.
  clientTimeout: 135s

  # requestTimeout is the timeout imposed on requests made by this client
  # through context cancellation.
  # TODO since clientTimeouts are implemented through context cancellations,
  # we might not need this.
  requestTimeout: 129s

  # netDialerTimeout is the maximum amount of time the HTTP Client Dialer will
  # wait for a connect to complete.
  netDialerTimeout: 5s


# requestRetryInterval is the time between HTTP request retries against XMiDT
requestRetryInterval: "2s"

# requestMaxRetries is the max number of times an HTTP request is retried against XMiDT in
# case of ephemeral errors
requestMaxRetries: 2

# tracing provides configuration around traces using OpenTelemetry.
# (Optional). By default, a 'noop' tracer provider is used and tracing is disabled.
tracing:
  # provider is the name of the trace provider to use: otlp/grpc, otlp/http,
  # stdout, or noop.  'noop' explicitly disables tracing.
  #
  # The jaeger and zipkin providers were removed in candlelight v0.4.0 along
  # with the OpenTelemetry exporters behind them.  Jaeger accepts OTLP
  # natively, so use otlp/grpc (port 4317) or otlp/http (port 4318) against
  # it.  For Zipkin, send OTLP to an OpenTelemetry Collector that exports to
  # Zipkin, or to a Zipkin server that accepts OTLP.
  provider: "noop"

  # environment names the deployment environment, such as "prod" or
  # "staging".  It is exported with every span as the deployment.environment
  # resource attribute.  Leave it empty to omit it.
  # (Optional)
  # environment: ""

  # skipTraceExport only applies when provider is stdout. Set skipTraceExport to true
  # so that trace information is not written to stdout.
  # skipTraceExport: true

  # endpoint is where trace information should be routed.  Applies to the
  # otlp providers.  OTLP/gRPC uses port 4317 by default and OTLP/HTTP uses
  # port 4318.
  # endpoint: "localhost:4317"

  # ParentBased and NoParent dictate if and when new spans should be created.
  # ParentBased = "ignore" (default), tracing is effectively turned off and the "NoParent" value is ignored
  # ParentBased = "honor", the sampling decision is made by the parent of the span
  parentBased: ignore

  # NoParent decides if a root span should be initiated in the case where there is no existing parent
  # This value is ignored if ParentBased = "ignore"
  # NoParent = "never" (default), root spans are not initiated
  # NoParent = "always", roots spans are initiated
  noParent: never

# previousVersionSupport allows us to support two different major versions of
# the API at the same time from the same application.  When this is true,
# tr1d1um will support both "/v2" and "/v3" endpoints.  When false, only "/v3"
# endpoints will be supported.
previousVersionSupport: true
